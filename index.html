<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Three.js + Cannon-es Scene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #16324f; }
    body { display: block; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!--
    ES module project set up via import maps.
    "three" and "cannon-es" are mapped to their ESM builds.
    A "three/addons/" mapping is included so you can pull in
    helpers like OrbitControls later without extra config.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
